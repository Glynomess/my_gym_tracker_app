<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gym Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #1a1a1a);
    color: var(--tg-theme-text-color, #fff);
    padding: 16px;
    padding-bottom: 90px;
    min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 20px 0 10px; opacity: 0.8; }

  .card {
    background: var(--tg-theme-secondary-bg-color, #2a2a2a);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }

  select, input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--tg-theme-bg-color, #1a1a1a);
    color: var(--tg-theme-text-color, #fff);
    font-size: 16px;
    margin-bottom: 8px;
  }

  select { appearance: none; -webkit-appearance: none; padding-right: 30px; }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-70%);
    pointer-events: none;
    opacity: 0.5;
  }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--tg-theme-button-color, #5288c1);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.7; }

  .btn-sm {
    padding: 8px 12px;
    font-size: 14px;
    width: auto;
  }

  .btn-ghost {
    background: rgba(255,255,255,0.08);
    color: var(--tg-theme-text-color, #fff);
  }

  .exercise-header {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .exercise-header .select-wrap { flex: 1; }
  .exercise-header select { margin-bottom: 0; }

  .add-ex-btn {
    width: 44px;
    padding: 0;
    font-size: 22px;
    flex-shrink: 0;
    background: var(--tg-theme-button-color, #5288c1);
    border-radius: 8px;
  }

  .set-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
  }
  .set-row:last-child { border-bottom: none; }
  .set-row:active { background: rgba(255,255,255,0.03); }
  .set-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    flex-shrink: 0;
  }
  .set-info { flex: 1; font-size: 15px; }
  .set-info .rec {
    font-size: 11px;
    opacity: 0.5;
    margin-left: 6px;
  }
  .del-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,80,80,0.15);
    color: #ff5050;
    border: none;
    font-size: 16px;
    padding: 0;
    flex-shrink: 0;
    cursor: pointer;
  }

  .hint {
    font-size: 12px;
    opacity: 0.5;
    margin-top: -4px;
    margin-bottom: 8px;
    min-height: 16px;
  }

  .workout-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: var(--tg-theme-secondary-bg-color, #2a2a2a);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .workout-item .name { font-weight: 600; }
  .workout-item .date { font-size: 12px; opacity: 0.6; }

  .empty {
    text-align: center;
    opacity: 0.5;
    padding: 30px 0;
    font-size: 14px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tabs button {
    background: var(--tg-theme-secondary-bg-color, #2a2a2a);
    color: var(--tg-theme-text-color, #fff);
    font-size: 14px;
    padding: 10px;
  }
  .tabs button.active {
    background: var(--tg-theme-button-color, #5288c1);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Модалка */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--tg-theme-secondary-bg-color, #2a2a2a);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
  }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .modal .row { margin-top: 8px; }
</style>
</head>
<body>

<h1>🏋️ Трекер тренировок</h1>

<div class="tabs">
  <button id="tabWorkout" class="active" onclick="switchTab('workout')">Тренировка</button>
  <button id="tabHistory" onclick="switchTab('history')">История</button>
</div>

<!-- ЭКРАН ТРЕНИРОВКИ -->
<div id="workoutTab" class="tab-content active">
  <div class="card">
    <div class="exercise-header">
      <div class="select-wrap">
        <select id="exerciseSelect" onchange="onExerciseChange()"></select>
      </div>
      <button class="add-ex-btn" onclick="openAddExercise()">+</button>
    </div>
    <div class="hint" id="recHint"></div>
    <div class="row">
      <input type="number" id="weightInput" placeholder="Вес (кг)" inputmode="decimal" step="0.5">
      <input type="number" id="repsInput" placeholder="Повторения" inputmode="numeric">
    </div>
    <button onclick="addSet()">+ Добавить подход</button>
  </div>

  <h2>Текущая тренировка</h2>
  <div id="currentSets"></div>
  <button id="finishBtn" style="margin-top:16px; background:#2ecc71;" onclick="finishWorkout()">✅ Завершить тренировку</button>
</div>

<!-- ЭКРАН ИСТОРИИ -->
<div id="historyTab" class="tab-content">
  <div id="historyList"></div>
</div>

<!-- МОДАЛКА: ДОБАВИТЬ УПРАЖНЕНИЕ -->
<div class="modal-bg" id="addExModal">
  <div class="modal">
    <h3>Новое упражнение</h3>
    <input type="text" id="newExName" placeholder="Название" autofocus>
    <div class="row">
      <button class="btn-ghost" onclick="closeAddExercise()">Отмена</button>
      <button onclick="saveNewExercise()">Добавить</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА: РЕДАКТИРОВАНИЕ ПОДХОДА -->
<div class="modal-bg" id="editSetModal">
  <div class="modal">
    <h3>Редактировать подход</h3>
    <div style="font-size:14px; opacity:0.7; margin-bottom:8px;" id="editSetExName"></div>
    <div class="row">
      <input type="number" id="editWeight" placeholder="Вес (кг)" inputmode="decimal" step="0.5">
      <input type="number" id="editReps" placeholder="Повторения" inputmode="numeric">
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn-ghost" onclick="closeEditSet()">Отмена</button>
      <button onclick="saveEditSet()">Сохранить</button>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // --- Данные ---
  const DEFAULT_EXERCISES = [
    'Жим лёжа', 'Присед', 'Становая тяга', 'Жим стоя',
    'Подтягивания', 'Отжимания на брусьях', 'Тяга штанги в наклоне',
    'Жим гантелей', 'Разводка гантелей', 'Бицепс со штангой',
    'Трицепс на блоке', 'Планка'
  ];

  let exercises = JSON.parse(localStorage.getItem('exercises') || 'null') || DEFAULT_EXERCISES;
  let currentSets = JSON.parse(localStorage.getItem('currentSets') || '[]');
  let history = JSON.parse(localStorage.getItem('history') || '[]');

  let editSetIndex = -1;

  function save() {
    localStorage.setItem('exercises', JSON.stringify(exercises));
    localStorage.setItem('currentSets', JSON.stringify(currentSets));
    localStorage.setItem('history', JSON.stringify(history));
  }

  // --- Табы ---
  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
    if (tab === 'workout') {
      document.getElementById('workoutTab').classList.add('active');
      document.getElementById('tabWorkout').classList.add('active');
    } else {
      document.getElementById('historyTab').classList.add('active');
      document.getElementById('tabHistory').classList.add('active');
      renderHistory();
    }
  }

  // --- Упражнения ---
  function renderExercises() {
    const sel = document.getElementById('exerciseSelect');
    const prev = sel.value;
    sel.innerHTML = exercises.map(e => `<option value="${e}">${e}</option>`).join('');
    if (prev && exercises.includes(prev)) sel.value = prev;
    onExerciseChange();
  }

  // --- РЕКОМЕНДАЦИЯ ВЕСА ---
  // Ищем последний подход по упражнению в истории
  function getLastSet(exercise) {
    for (const w of history) {
      // идём с конца каждой тренировки
      for (let i = w.sets.length - 1; i >= 0; i--) {
        if (w.sets[i].exercise === exercise) return w.sets[i];
      }
    }
    return null;
  }

  function onExerciseChange() {
    const ex = document.getElementById('exerciseSelect').value;
    const last = getLastSet(ex);
    const wInput = document.getElementById('weightInput');
    const rInput = document.getElementById('repsInput');
    const hint = document.getElementById('recHint');

    if (last) {
      // подставляем как placeholder — серый текст, исчезает при вводе
      wInput.placeholder = last.weight;
      rInput.placeholder = last.reps;
      hint.textContent = `Прошлый раз: ${last.weight} кг × ${last.reps}`;
    } else {
      wInput.placeholder = 'Вес (кг)';
      rInput.placeholder = 'Повторения';
      hint.textContent = '';
    }
  }

  // --- ДОБАВЛЕНИЕ УПРАЖНЕНИЯ ---
  function openAddExercise() {
    document.getElementById('newExName').value = '';
    document.getElementById('addExModal').classList.add('show');
    setTimeout(() => document.getElementById('newExName').focus(), 100);
  }
  function closeAddExercise() {
    document.getElementById('addExModal').classList.remove('show');
  }
  function saveNewExercise() {
    const name = document.getElementById('newExName').value.trim();
    if (!name) return alert('Введи название');
    if (exercises.includes(name)) return alert('Такое уже есть');
    exercises.push(name);
    save();
    renderExercises();
    document.getElementById('exerciseSelect').value = name;
    onExerciseChange();
    closeAddExercise();
    if (tg) tg.HapticFeedback.notificationOccurred('success');
  }

  // --- Подходы ---
  function addSet() {
    const ex = document.getElementById('exerciseSelect').value;
    const wInput = document.getElementById('weightInput');
    const rInput = document.getElementById('repsInput');

    // Если поле пустое — берём рекомендованное значение из placeholder
    const w = parseFloat(wInput.value || wInput.placeholder);
    const r = parseInt(rInput.value || rInput.placeholder);

    if (!ex) return alert('Выбери упражнение');
    if (!w || w <= 0) return alert('Введи вес');
    if (!r || r <= 0) return alert('Введи количество повторений');

    currentSets.push({ exercise: ex, weight: w, reps: r, time: Date.now() });
    wInput.value = '';
    rInput.value = '';
    save();
    renderCurrentSets();
    if (tg) tg.HapticFeedback.impactOccurred('light');
  }

  function deleteSet(index) {
    currentSets.splice(index, 1);
    save();
    renderCurrentSets();
    if (tg) tg.HapticFeedback.impactOccurred('medium');
  }

  // --- РЕДАКТИРОВАНИЕ ПОДХОДА ---
  function openEditSet(index) {
    editSetIndex = index;
    const s = currentSets[index];
    document.getElementById('editSetExName').textContent = s.exercise;
    document.getElementById('editWeight').value = s.weight;
    document.getElementById('editReps').value = s.reps;
    document.getElementById('editSetModal').classList.add('show');
  }
  function closeEditSet() {
    document.getElementById('editSetModal').classList.remove('show');
    editSetIndex = -1;
  }
  function saveEditSet() {
    if (editSetIndex < 0) return;
    const w = parseFloat(document.getElementById('editWeight').value);
    const r = parseInt(document.getElementById('editReps').value);
    if (!w || w <= 0) return alert('Введи вес');
    if (!r || r <= 0) return alert('Введи повторения');
    currentSets[editSetIndex].weight = w;
    currentSets[editSetIndex].reps = r;
    save();
    renderCurrentSets();
    closeEditSet();
    onExerciseChange(); // обновить рекомендацию
    if (tg) tg.HapticFeedback.notificationOccurred('success');
  }

  function renderCurrentSets() {
    const container = document.getElementById('currentSets');
    if (currentSets.length === 0) {
      container.innerHTML = '<div class="empty">Пока нет подходов<br>Добавь первый 💪</div>';
      return;
    }

    const grouped = {};
    currentSets.forEach((s, i) => {
      if (!grouped[s.exercise]) grouped[s.exercise] = [];
      grouped[s.exercise].push({ ...s, index: i });
    });

    let html = '';
    for (const [ex, sets] of Object.entries(grouped)) {
      html += `<div class="card"><div style="font-weight:600;margin-bottom:8px;">${ex}</div>`;
      sets.forEach((s, n) => {
        html += `
          <div class="set-row" onclick="openEditSet(${s.index})">
            <div class="set-num">${n + 1}</div>
            <div class="set-info">${s.weight} кг × ${s.reps}</div>
            <button class="del-btn" onclick="event.stopPropagation(); deleteSet(${s.index})">×</button>
          </div>`;
      });
      html += '</div>';
    }
    container.innerHTML = html;
  }

  // --- Завершение тренировки ---
  function finishWorkout() {
    if (currentSets.length === 0) return alert('Добавь хотя бы один подход');

    const workout = {
      date: new Date().toISOString(),
      sets: [...currentSets]
    };
    history.unshift(workout);
    currentSets = [];
    save();
    renderCurrentSets();
    onExerciseChange(); // обновить рекомендации с учётом новой тренировки
    if (tg) {
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Тренировка сохранена! 💪');
    } else {
      alert('Тренировка сохранена!');
    }
    switchTab('history');
  }

  // --- История ---
  function renderHistory() {
    const container = document.getElementById('historyList');
    if (history.length === 0) {
      container.innerHTML = '<div class="empty">История пуста<br>Заверши первую тренировку 🏋️</div>';
      return;
    }

    container.innerHTML = history.map((w, i) => {
      const d = new Date(w.date);
      const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const totalSets = w.sets.length;
      const totalVolume = w.sets.reduce((sum, s) => sum + s.weight * s.reps, 0);
      return `
        <div class="workout-item" onclick="openWorkout(${i})">
          <div>
            <div class="name">${dateStr}</div>
            <div class="date">${timeStr} • ${totalSets} подходов • ${Math.round(totalVolume)} кг</div>
          </div>
          <div style="opacity:0.5;">›</div>
        </div>`;
    }).join('');
  }

  function openWorkout(index) {
    const w = history[index];
    const grouped = {};
    w.sets.forEach(s => {
      if (!grouped[s.exercise]) grouped[s.exercise] = [];
      grouped[s.exercise].push(s);
    });

    let msg = `📅 ${new Date(w.date).toLocaleString('ru-RU')}\n\n`;
    for (const [ex, sets] of Object.entries(grouped)) {
      msg += `${ex}:\n`;
      sets.forEach((s, n) => { msg += `  ${n + 1}. ${s.weight} кг × ${s.reps}\n`; });
      msg += '\n';
    }

    if (tg) tg.showAlert(msg);
    else alert(msg);
  }

  // --- Init ---
  renderExercises();
  renderCurrentSets();
  renderHistory();

  // Закрытие модалок по фону
  document.querySelectorAll('.modal-bg').forEach(m => {
    m.addEventListener('click', e => {
      if (e.target === m) {
        m.classList.remove('show');
        editSetIndex = -1;
      }
    });
  });

  // Enter в модалке добавления
  document.getElementById('newExName').addEventListener('keypress', e => {
    if (e.key === 'Enter') saveNewExercise();
  });
</script>
</body>
</html>
